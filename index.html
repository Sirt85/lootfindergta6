*{box-sizing:border-box}body{margin:0;background:#151820;color:#eee;font:15px system-ui}header,section{padding:12px}h1{margin:0;color:#ff9ac9;font-size:23px}button,select,input{font:inherit;background:#303644;color:white;border:1px solid #555;border-radius:8px;padding:9px}button{cursor:pointer}#map{height:52vh;position:relative;overflow:hidden;background:#087d95;touch-action:none}#layer{position:absolute;transform-origin:0 0;width:1051px;height:1440px}#layer img{width:100%;height:100%;pointer-events:none}.pin{position:absolute;border:2px solid white;border-radius:50%;width:30px;height:30px;padding:0;transform:translate(-50%,-50%);font-weight:bold;color:#111}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #444;display:flex;gap:10px;align-items:center}.item div{flex:1}small{color:#bbc0cb}dialog{background:#222733;color:white;border:1px solid #555;border-radius:12px;width:90%}dialog input,dialog select{width:100%;margin:5px 0}#progress{color:#9ee9bd} header{padding-top:36px}.pin{width:24px;height:24px}body.full header,body.full #list,body.full #hint{display:none}body.full #map{height:80vh}#search{width:100%;margin-top:8px}section:last-of-type{padding-bottom:48px}</style><header><h1>GTA VI · LOOT FINDER</h1><small>Offline · Leonida · Version 1.3 · inoffiziell</small><p id="progress"></p><div class="row"><select id="chapter"><option value="0">Alle Kapitel</option><option value="1">Kapitel 1</option><option value="2">Kapitel 2</option></select><select id="filter"><option>Alle</option><option>Legendär</option><option>Waffen</option><option>Geld</option></select><label><input type="checkbox" id="hide"> Gefundene ausblenden</label></div><input id="search" placeholder="Fundort suchen…"></header><div id="map"><div id="layer"><img src="map.jpg" alt="Leonida Karte"></div></div><section class="row"><button id="plus">＋</button><button id="minus">−</button><button id="reset">Gesamtkarte</button><button id="full">Vollbild</button><button id="backup">Sichern</button><button id="restore">Import</button><button id="add">＋ Fundort</button></section><section><small id="hint">Karte ziehen oder mit zwei Fingern zoomen. 34 recherchierte Einträge. Kartenpositionen geschätzt; Quellen in den Details.</small><div id="list"></div></section><dialog id="edit"><form id="form"><h2>Fundort</h2><input id="name" required placeholder="Name"><select id="type"><option>Legendär</option><option>Waffen</option><option>Geld</option></select><select id="editChapter"><option value="1">Kapitel 1</option><option value="2">Kapitel 2</option></select><input id="note" placeholder="Hinweis / Tresorcode"><label><input id="found" type="checkbox" style="width:auto"> Gefunden</label><p class="row"><button type="submit">Speichern</button><button type="button" id="move">Position ändern</button><button type="button" id="del">Löschen</button><button type="button" id="cancel">Abbrechen</button></p></form></dialog><script>

w.gta-xtreme.com/de/gta-6-loot-locations", "done": false}, {"id": "web-14", "name": "Corsair Keys – Stelzenhaus", "type": "Geld", "x": 735, "y": 1120, "note": "Ungefähre Kartenposition. Nordöstlich des Inselgebiets Richtung Atlantik: lose Bodendiele und weitere Beute, ca. $1.500. Quelle: https://www.gamestar.de/artikel/gta-6-schnell-geld-verdienen-kapitel-1%2C3463547.html", "done": false}, {"id": "web-15", "name": "Marabunta Grande Hobo", "type": "Legendär", "x": 624, "y": 1060, "note": "Ungefähre Kartenposition. Industriegebäude im südlichen Vice-Dale County, südlich von Hamlet. Quelle: https://gta6.house/guides/gta-6-free-legendary-weapons-locations", "done": false}, {"id": "web-16", "name": "Hunter’s Laird 350", "type": "Legendär", "x": 555, "y": 1005, "note": "Ungefähre Kartenposition. Zufallsereignis mit zwei Jägern auf Nebenstrasse bei Hamlet. Quelle: https://gta6.house/guides/gta-6-free-legendary-weapons-locations", "done": false}, {"id": "web-17", "name": "Marabunta Grande KZ-59", "type": "Legendär", "x": 604, "y": 982, "note": "Ungefähre Kartenposition. Nova Auto Schrottplatz in Hamlet. Quelle: https://gta6.house/guides/gta-6-free-legendary-weapons-locations", "done": false}];if(!localStorage.getItem("loot-seed-v1")){data.push(...defaults.filter(p=>!data.some(q=>q.id===p.id)));localStorage.setItem("loot-v1",JSON.stringify(data));localStorage.setItem("loot-seed-v1","1")}const chapter2=[{"id": "ch2-0", "name": "Gutterball Moreland 850", "type": "Legendär", "x": 320, "y": 550, "note": "Geschätzte Kartenposition. Kingpin Bowling, Billardtisch im Nordosten. Quelle: https://www.keengamer.com/articles/guides/gta-6-all-8-legendary-weapon-locations-in-port-gellhorn/", "done": false, "chapter": 2}, {"id": "ch2-1", "name": "Scrapper VF5C", "type": "Legendär", "x": 285, "y": 505, "note": "Geschätzte Kartenposition. La Cascara Motel, Waffenkoffer im Obergeschoss. Quelle: https://www.keengamer.com/articles/guides/gta-6-all-8-legendary-weapon-locations-in-port-gellhorn/", "done": false, "chapter": 2}, {"id": "ch2-2", "name": "Clunker 556", "type": "Legendär", "x": 305, "y": 465, "note": "Geschätzte Kartenposition. Brooks Boatworks, Büro im Obergeschoss. Quelle: https://www.keengamer.com/articles/guides/gta-6-all-8-legendary-weapon-locations-in-port-gellhorn/", "done": false, "chapter": 2}, {"id": "ch2-3", "name": "Kolt & Associates 556", "type": "Legendär", "x": 340, "y": 475, "note": "Geschätzte Kartenposition. Stash House östlich von Brooks Boatworks. Quelle: https://www.keengamer.com/articles/guides/gta-6-all-8-legendary-weapon-locations-in-port-gellhorn/", "done": false, "chapter": 2}, {"id": "ch2-4", "name": "Kolt & Associates Vatra", "type": "Legendär", "x": 355, "y": 520, "note": "Geschätzte Kartenposition. June Warehouse; genaue Lage unbekannt. Quelle: https://www.keengamer.com/articles/guides/gta-6-all-8-legendary-weapon-locations-in-port-gellhorn/", "done": false, "chapter": 2}, {"id": "ch2-5", "name": "Kingpin Bowling – Tresor", "type": "Geld", "x": 330, "y": 560, "note": "Geschätzte Kartenposition. Südliches Port Gellhorn an US-9. Code 0300. Quelle: https://space4games.com/en/games-en/gta-6-safe-codes-combinations-locations/", "done": false, "chapter": 2}, {"id": "ch2-6", "name": "La Cascara Motel – Tresor", "type": "Geld", "x": 275, "y": 515, "note": "Geschätzte Kartenposition. Westliches Port Gellhorn. Code 6969. Quelle: https://space4games.com/en/games-en/gta-6-safe-codes-combinations-locations/", "done": false, "chapter": 2}, {"id": "ch2-7", "name": "Brooks Boatworks – Tresor", "type": "Geld", "x": 295, "y": 455, "note": "Geschätzte Kartenposition. Docks nahe Draper Island. Code 6823. Quelle: https://space4games.com/en/games-en/gta-6-safe-codes-combinations-locations/", "done": false, "chapter": 2}, {"id": "ch2-8", "name": "Stash House – Tresor", "type": "Geld", "x": 350, "y": 485, "note": "Geschätzte Kartenposition. Tresor aufbrechen; etwa $1.100–4.200 laut Guide. Quelle: https://gta6playertools.com/guides/chapter-2-money", "done": false, "chapter": 2}, {"id": "ch2-9", "name": "June Warehouse – Tresor", "type": "Geld", "x": 365, "y": 530, "note": "Geschätzte Kartenposition. Tresor aufbrechen; genaue Lage unbekannt. Quelle: https://gta6playertools.com/guides/chapter-2-money", "done": false, "chapter": 2}, {"id": "ch2-10", "name": "Hinter dem Friseursalon", "type": "Geld", "x": 315, "y": 525, "note": "Geschätzte Kartenposition. Hinterzimmer mit Tresor; Lage nur grob bekannt. Quelle: https://gta6playertools.com/guides/chapter-2-money", "done": false, "chapter": 2}, {"id": "ch2-11", "name": "Sunrise RV Park – Tresor", "type": "Geld", "x": 465, "y": 1040, "note": "Geschätzte Kartenposition. Cottonmouth Bay, Nordufer des Sees. Code 6769. Quelle: https://space4games.com/en/games-en/gta-6-safe-codes-combinations-locations/", "done": false, "chapter": 2}, {"id": "ch2-12", "name": "Nova Auto Junkyard – Tresor", "type": "Geld", "x": 615, "y": 980, "note": "Geschätzte Kartenposition. Hamlet, Highway östlich von Layin’ Ink. Code 7777. Quelle: https://space4games.com/en/games-en/gta-6-safe-codes-combinations-locations/", "done": false, "chapter": 2}, {"id": "ch2-13", "name": "Firebug Dominator", "type": "Geld", "x": 265, "y": 495, "note": "Geschätzte Kartenposition. La Cascara Motel; Verkauf an Moses ca. $6.500–7.000. Quelle: https://gta6playertools.com/guides/chapter-2-money", "done": false, "chapter": 2}, {"id": "ch2-14", "name": "Truth & Justice Caracara", "type": "Geld", "x": 375, "y": 540, "note": "Geschätzte Kartenposition. June Warehouse; Verkauf ca. $5.900. Quelle: https://gta6playertools.com/guides/chapter-2-money", "done": false, "chapter": 2}, {"id": "ch2-15", "name": "Smuggler Caracara", "type": "Geld", "x": 285, "y": 445, "note": "Geschätzte Kartenposition. Brooks Boatworks; Verkauf ca. $5.000 oder mehr. Quelle: https://gta6playertools.com/guides/chapter-2-money", "done": false, "chapter": 2}];if(!localStorage.getItem("loot-seed-v2")){data.push(...chapter2.filter(p=>!data.some(q=>q.id===p.id)));localStorage.setItem("loot-v1",JSON.stringify(data));localStorage.setItem("loot-seed-v2","1")}data.forEach(p=>{if(p.id==="web-17"&&!p.chapter)p.chapter=2});localStorage.setItem("loot-v1",JSON.stringify(data));let scale=.4,x=0,y=0,adding=false,moving=null,current=null,points=new Map(),start=null;const colors={'Legendär':'#ffd45c','Waffen':'#ff7777','Geld':'#6ee7a0'};function save(){localStorage.setItem('loot-v1',JSON.stringify(data));render()}function transform(){layer.style.transform=`translate(${x}px,${y}px) scale(${scale})`;layer.querySelectorAll('.pin').forEach(p=>p.style.transform=`translate(-50%,-50%) scale(${1/scale})`)}function reset(){scale=Math.min(map.clientWidth/1051,map.clientHeight/1440);x=(map.clientWidth-1051*scale)/2;y=(map.clientHeight-1440*scale)/2;transform()}function zoom(f,cx=map.clientWidth/2,cy=map.clientHeight/2){let n=Math.max(.15,Math.min(5,scale*f));x=cx-(cx-x)*n/scale;y=cy-(cy-y)*n/scale;scale=n;transform()}function render(){layer.querySelectorAll('.pin').forEach(p=>p.remove());$('list').replaceChildren();const visible=data.filter(p=>$('chapter').value==='0'||Number($('chapter').value)===(p.chapter||1));$('progress').textContent=visible.filter(p=>p.done).length+' / '+visible.length+' gefunden';for(const p of visible){if(!(p.name+" "+p.note).toLowerCase().includes($("search").value.toLowerCase()))continue;if(($('filter').value!=='Alle'&&$('filter').value!==p.type)||($('hide').checked&&p.done))continue;let b=document.createElement('button');b.className='pin';b.style.left=p.x+'px';b.style.top=p.y+'px';b.style.background=p.done?'#aaa':colors[p.type];b.textContent=p.done?'✓':p.type==='Geld'?'$':'!';b.setAttribute('aria-label',p.name);b.onpointerdown=e=>e.stopPropagation();b.onclick=()=>open(p);layer.append(b);let row=document.createElement('div');row.className='item';let check=document.createElement('input');check.type='checkbox';check.checked=p.done;check.onchange=()=>{p.done=check.checked;save()};let d=document.createElement('div');d.textContent=p.name+' · '+p.type;let s=document.createElement('small');s.textContent=p.note;d.append(document.createElement('br'),s);let edit=document.createElement('button');edit.textContent='Details';edit.onclick=()=>{x=map.clientWidth/2-p.x*scale;y=map.clientHeight/2-p.y*scale;transform();open(p)};row.append(check,d,edit);$('list').append(row)}transform()}
function open(p){current=p;$('editChapter').value=String(p.chapter||Number($('chapter').value)||1);$('name').value=p.name;$('type').value=p.type;$('note').value=p.note;$('found').checked=p.done;$('del').hidden=!data.includes(p);$('edit').showModal()}$('form').onsubmit=e=>{e.preventDefault();Object.assign(current,{chapter:Number($('editChapter').value),name:$('name').value,type:$('type').value,note:$('note').value,done:$('found').checked});if(!data.includes(current))data.push(current);save();$('edit').close()};$('move').onclick=()=>{if(!data.includes(current))return;moving=current;adding=true;$('edit').close();$('hint').textContent='Neue Position antippen.'};$('cancel').onclick=()=>$('edit').close();$('del').onclick=()=>{data=data.filter(p=>p!==current);save();$('edit').close()};$('filter').onchange=$('hide').onchange=render;$('chapter').onchange=()=>{if($('chapter').value!=='0'){let north=$('chapter').value==='2';x=map.clientWidth/2-(north?320:530)*scale;y=map.clientHeight/2-(north?510:1100)*scale}render()};$('plus').onclick=()=>zoom(1.4);$('minus').onclick=()=>zoom(1/1.4);$('reset').onclick=reset;$('add').onclick=()=>{adding=!adding;$('hint').textContent=adding?'Tippe jetzt auf die gewünschte Kartenposition.':'Karte ziehen oder zoomen.'};function pos(e){let r=map.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}map.onpointerdown=e=>{let p=pos(e);points.set(e.pointerId,p);map.setPointerCapture(e.pointerId);start=points.size===1?p:null};map.onpointermove=e=>{if(!points.has(e.pointerId))return;let old=points.get(e.pointerId),p=pos(e);if(points.size===2){let q=[...points.entries()].find(a=>a[0]!==e.pointerId)[1];let a=Math.hypot(old.x-q.x,old.y-q.y),b=Math.hypot(p.x-q.x,p.y-q.y);if(a>0)zoom(b/a,q.x,q.y)}else{x+=p.x-old.x;y+=p.y-old.y;transform()}points.set(e.pointerId,p)};map.onpointerup=e=>{let p=pos(e);if(adding&&start&&Math.hypot(p.x-start.x,p.y-start.y)<8){let px=(p.x-x)/scale,py=(p.y-y)/scale;if(px>=0&&px<=1051&&py>=0&&py<=1440){adding=false;$('hint').textContent='Fundorte antippen für Details.';if(moving){moving.x=px;moving.y=py;moving=null;save();return}open({x:px,y:py,name:'',type:'Legendär',note:'',done:false})}}points.delete(e.pointerId);start=null};map.onpointercancel=e=>{points.delete(e.pointerId);start=null};map.onwheel=e=>{e.preventDefault();let p=pos(e);zoom(e.deltaY<0?1.2:1/1.2,p.x,p.y)};$('search').oninput=render;$('full').onclick=()=>{document.body.classList.toggle('full');reset()};$('backup').onclick=()=>{let b=new Blob([JSON.stringify(data)],{type:'application/json'});let d=document.createElement('dialog');let t=document.createElement('textarea');t.value=JSON.stringify(data);t.style.width='100%';t.rows=8;let c=document.createElement('button');c.textContent='Schliessen';c.onclick=()=>{d.close();d.remove()};d.append('Sicherung kopieren und aufbewahren',t,c);document.body.append(d);d.showModal();t.select()};$('restore').onclick=()=>{let d=document.createElement('dialog'),t=document.createElement('textarea'),c=document.createElement('button'),q=document.createElement('button');t.style.width='100%';t.rows=8;c.textContent='Importieren';q.textContent='Abbrechen';q.onclick=()=>{d.close();d.remove()};c.onclick=()=>{try{let v=JSON.parse(t.value);if(!Array.isArray(v)||!v.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&typeof p.note==='string'&&Number.isFinite(p.x)&&Number.isFinite(p.y)))throw Error();for(let p of v){let i=data.findIndex(q=>q.id===p.id);if(i<0)data.push(p);else data[i]=p}save();d.close();d.remove()}catch(e){t.setCustomValidity('Ungültige Sicherung');t.reportValidity()}};t.oninput=()=>t.setCustomValidity('');d.append('Sicherung einfügen',t,c,q);document.body.append(d);d.showModal()};reset();zoom(2);x=map.clientWidth/2-530*scale;y=map.clientHeight/2-1100*scale;render();</script></html>
